# Builds the Vergence desktop app's release files with the packaging scripts in desktop/scripts
# (the same ones as a local build) and attests where each came from:
#
#   gh attestation verify Vergence-<version>-macos-universal.zip -R illixion/vergence
#
#   Vergence-<version>-macos-universal.zip    Vergence.app (arm64 + x86_64) with the `vergence`
#                                             command line in Contents/Resources
#   Vergence-<version>-windows-x86_64.zip     Vergence.exe, WebView2Loader.dll, and the ONNX
#                                             Runtime worker and converter built on Windows
#   Vergence-<version>-windows-arm64.zip      the same for Windows on ARM, all built natively
#                                             on windows-11-arm
#
# Nothing here signs or publishes a release. The files land on a draft GitHub release (and as a
# workflow artifact); the updater trusts a release only through a SHA256SUMS signed by the release
# key (PIN and touch, never on CI), so the owner then runs, in the foreground,
#
#   desktop/scripts/bless-release.sh --tag v<version> --publish
#
# which signs the draft's files, uploads the signature and publishes: apps find it through
# apps.illixion.com's redirect to GitHub's releases/latest, which names only published releases.
# An attestation says "GitHub built this from that commit"; the signature says "and its owner
# vouches for it". Neither macOS nor Windows files are notarized or code-signed.
#
# Run it by hand (Actions > Release build > Run workflow) or by pushing a v<version> tag. The
# version must already be committed in the workspace Cargo.toml. A manual run with no version
# builds at the committed version and publishes nothing (no attestation): use it to try the
# packaging, and to warm the caches, since only runs on main save them and a tag restores them
# (a run restores only caches saved on its own ref or on main, so a cold release is the slow one).
#
# The Swift command line needs a Mac with a recent Xcode. Set the repository variable
# MACOS_RUNNER (Settings > Secrets and variables > Actions > Variables) to a runner label with
# Xcode 27 to build with it; without it the macos-26 image's newest Xcode is used.
#
# Actions are pinned to commits, not tags, which can be moved; the comment names the tag each
# was taken from (the same pins as Apparition's release workflow, 2026-11-04).

name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (major.minor.patch), as committed in Cargo.toml; empty builds without publishing"
        required: false
      parts:
        description: "What to build: all, or a comma-separated list of macos, windows"
        default: all
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}
  # Caches are saved only here, where every release can restore them (see the top).
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  RUST_TOOLCHAIN: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  # The version to build, checked against the committed one, and which parts to run.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          PARTS: ${{ inputs.parts || 'all' }}
        run: |
          set -euo pipefail
          committed="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          version="${VERSION#v}"
          publish=true
          if [[ -z "$version" ]]; then
            version="$committed"; publish=false
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$version isn't major.minor.patch"; exit 1; }
          [[ "$version" == "$committed" ]] || { echo "::error::Cargo.toml's version is $committed, not $version; commit the bump first"; exit 1; }
          macos=false; windows=false
          for part in ${PARTS//,/ }; do
            case "$part" in
              all) macos=true; windows=true ;;
              macos) macos=true ;;
              windows) windows=true ;;
              *) echo "::error::no part called $part (all, macos, windows)"; exit 1 ;;
            esac
          done
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "macos=$macos"
            echo "windows=$windows"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Vergence $version (publish: $publish, macos: $macos, windows: $windows)" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS app
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vergence
    steps:
      # signed-update is a path dependency of the workspace (desktop/Cargo.toml), so every job that
      # builds it has the repository beside this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: vergence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: illixion/signed-update, path: signed-update }
      - name: Choose Xcode
        run: |
          # The newest one on the image (27 where there is one); the command line needs Swift 6.2.
          newest="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version
      - name: Tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      # Tauri's prebuilt CLI, checked against pinned hashes; compiling it took about 9 minutes.
      - name: Tauri CLI
        run: desktop/scripts/install-tauri-cli.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vergence
          key: macos-release
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build
        run: desktop/scripts/package-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: vergence/target/package/Vergence-*-macos-universal.zip
          if-no-files-found: error

  # The converter and the worker are ONNX Runtime programs (DirectML), whose Windows binaries
  # ort downloads for the MSVC target, so they are built here, on Windows. The app itself is
  # cross-compiled by desktop/scripts/package-windows.sh, as on a developer's Mac.
  windows-tools:
    name: Windows worker and converter
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vergence
    steps:
      # signed-update is a path dependency of the workspace (desktop/Cargo.toml), so every job that
      # builds it has the repository beside this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: vergence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: illixion/signed-update, path: signed-update }
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vergence
          key: windows-tools-release
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build
        shell: bash
        run: cargo build --release --locked -p vergence-worker -p vergence-convert
      # Every program and DLL the build put beside them (ONNX Runtime's and DirectML's, where
      # the build copies them), which the app finds next to Vergence.exe.
      - name: Collect
        shell: bash
        run: |
          mkdir tools
          cp target/release/vergence-worker.exe target/release/vergence-convert.exe tools/
          shopt -s nullglob
          for f in target/release/*.dll; do cp "$f" tools/; done
          ls -l tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-tools
          path: vergence/tools/*
          if-no-files-found: error

  windows:
    name: Windows app
    needs: [plan, windows-tools]
    if: needs.plan.outputs.windows == 'true'
    # A Mac, as for the local build: Homebrew's mingw-w64 is the toolchain the script was made for.
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vergence
    steps:
      # signed-update is a path dependency of the workspace (desktop/Cargo.toml), so every job that
      # builds it has the repository beside this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: vergence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: illixion/signed-update, path: signed-update }
      - name: Tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-gnu
          rustup default "$RUST_TOOLCHAIN"
          brew install mingw-w64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-tools
          path: vergence/windows-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vergence
          key: windows-app-release
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build
        run: desktop/scripts/package-windows.sh --tools windows-tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: vergence/target/package/Vergence-*-windows-x86_64.zip
          if-no-files-found: error

  # Windows on ARM, built natively: mingw has no ARM64 toolchain, and ONNX Runtime's ARM64
  # binaries are for MSVC. ring and aws-lc (the update check's TLS) compile their C and assembly
  # with clang on this target, and OpenSSL (the paired channel) builds with a Windows Perl and
  # CPPFLAGS=-Gs (desktop/scripts/package-windows.sh says why; without it the channel crashes).
  windows-arm64:
    name: Windows on ARM app
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      CPPFLAGS: -Gs
    defaults:
      run:
        shell: bash
        working-directory: vergence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: vergence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { repository: illixion/signed-update, path: signed-update }
      - name: Tools
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"
          printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          # Git Bash's own perl comes first on PATH and can't configure OpenSSL for MSVC.
          win_perl="$(where.exe perl 2>/dev/null | tr -d '\r' | grep -viE '[\\/]Git[\\/]' | head -1 || true)"
          [[ -n "$win_perl" ]] || { echo "::error::no Windows Perl on this image"; exit 1; }
          echo "OPENSSL_SRC_PERL=$win_perl" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: vergence
          key: windows-arm64-release
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Worker and converter
        run: |
          cargo build --release --locked --target aarch64-pc-windows-msvc -p vergence-worker -p vergence-convert
          mkdir tools
          built=target/aarch64-pc-windows-msvc/release
          cp "$built/vergence-worker.exe" "$built/vergence-convert.exe" tools/
          shopt -s nullglob
          for f in "$built"/*.dll; do cp "$f" tools/; done
          ls -l tools
      - name: Build
        run: desktop/scripts/package-windows.sh --arch arm64 --tools tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-arm64
          path: vergence/target/package/Vergence-*-windows-arm64.zip
          if-no-files-found: error

  attest:
    name: Attest and draft the release
    # Parts that weren't asked for are skipped, which would skip this too without the condition.
    needs: [plan, macos, windows, windows-arm64]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      # contents: write only to create the draft release; nothing here publishes it.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: files
          # The build jobs' own artifacts, not the Windows tools (which are inside the zip).
          pattern: "{macos,windows,windows-arm64}"
          merge-multiple: true
      - name: List
        run: |
          cd files && ls -l
          { echo '```'; sha256sum Vergence-*; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: files/Vergence-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: files/Vergence-*
      # The files go on a DRAFT release, which apps can't see: GitHub's releases/latest, which
      # apps.illixion.com redirects to, names only published ones. The owner then runs
      # desktop/scripts/bless-release.sh --publish, which signs the files with the release key and
      # publishes. A rerun replaces the draft's files; a published release is never touched.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "$tag" files/Vergence-* -R "$GITHUB_REPOSITORY" --clobber
          elif gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag is already published; bump the version instead"; exit 1
          else
            gh release create "$tag" files/Vergence-* -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Vergence $VERSION" --notes "Draft: signed and published by desktop/scripts/bless-release.sh."
          fi
          echo "Draft release $tag. Next: desktop/scripts/bless-release.sh --tag $tag --publish" >> "$GITHUB_STEP_SUMMARY"
