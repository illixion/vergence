[package]
name = "vergence-coordinator"
description = "Queues analysis work (Smooth Motion fields, depth, gain grids) for workers and serves the results to players, for Jellyfin and Stash"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vergenced"
path = "src/bin/vergenced.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
bytes = "1"
rand = "0.9"
# The paired channel: the same API over TLS 1.2 PSK, keyed from each device's pairing token.
vergence-companion = { path = "../companion" }
openssl = "0.10"
tokio-openssl = "0.6"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
hkdf = "0.12"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
