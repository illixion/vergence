[package]
name = "vergence-desktop"
description = "The Vergence desktop app: the analysis coordinator and a worker in one tray app, headset pairing, and AI 3D side-by-side conversion of video files"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vergence-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vergence-coordinator = { path = "../coordinator" }
vergence-companion = { path = "../companion" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# openpty, so `vergence convert` sees a terminal and prints its progress; renamex_np for updates.
libc = "0.2"

[features]
# Serves the bundled ui/ instead of a dev server. `cargo tauri build` turns it on.
custom-protocol = ["tauri/custom-protocol"]
