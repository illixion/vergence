[package]
name = "vergence-convert"
description = "Converts any 2D video to an AI 3D side-by-side copy (the Windows and Linux `vergence convert`): ONNX Runtime depth, a wgpu warp, ffmpeg to decode and encode"
version.workspace = true
edition.workspace = true
license.workspace = true

# The depth pipeline is also a library: vergence-worker's ai-3d-depth runs it per piece.
[lib]
name = "vergence_convert"
path = "src/lib.rs"

[[bin]]
name = "vergence-convert"
path = "src/main.rs"

[features]
# Execution providers for the depth model beyond the platform's default
# (Core ML on macOS, DirectML on Windows), as vergence-worker has them.
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
directml = ["ort/directml"]
coreml = ["ort/coreml"]
# The larger depth models, whose weights are CC-BY-NC-4.0 (Depth Anything V2
# Base and Large) or research-only: off by default, for builds made for
# non-commercial use (sideloaded, never a store's). Without it they are
# refused, and --download-model names only Small.
noncommercial-models = []

[dependencies]
ort = "=2.0.0-rc.15"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
